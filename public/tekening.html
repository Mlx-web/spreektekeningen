<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spreektekeningen</title>
  <link rel="stylesheet" href="css/stijl.css">
</head>
<body>

  <header class="koptekst">
    <h1 id="thema-titel">Tekening</h1>
    <a id="koptekst-terug" class="koptekst__terug" href="index.html">← Overzicht</a>
  </header>

  <main class="tekening-omgeving">

    <!-- Interactief gebied: dit is wat er op scherm staat tijdens het consult. -->
    <div id="interactief-gebied">

      <div class="tekening-kolom">
        <div class="tekening-kader">
          <!-- De paden worden hier door tekening.js ingevoegd (viewBox uit het thema). -->
          <svg id="tekening-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>

        <div class="tekening-info">
          <span id="stap-label">—</span>
        </div>

        <div class="tekening-knoppen">
          <button id="knop-reset" type="button" class="knop knop--secundair">Opnieuw</button>
          <button id="knop-volgende" type="button" class="knop knop--primair">Maak tekening</button>
        </div>

        <div class="tekening-extra">
          <button id="knop-print" type="button" class="knop knop--secundair">Print deze tekening</button>
        </div>
      </div>

      <!--
        Zijpaneel: altijd zichtbaar naast de tekening (geen "Bewerken"-klik
        meer nodig). Let op: dit staat op dezelfde pagina die een patiënt
        via de QR-code thuis opent -- er is geen inlog/rol-onderscheid (net
        als in de rest van de app), dus net als bij de Thuisarts-link geldt
        hier: geen patiëntgegevens invullen. Opslaan (POST) vereist het
        wachtwoord (env var BEHEER_WACHTWOORD); ophalen (GET) is publiek.
      -->
      <aside class="zijpaneel">
        <div class="zijpaneel__qr-blok">
          <div id="zijpaneel-qr" class="zijpaneel__qr"></div>
          <p class="zijpaneel__qr-tekst">Deze QR-code kan de patiënt scannen om de tekening thuis nog eens te bekijken.</p>
        </div>

        <form id="beheer-form" class="beheer__form">
          <label class="beheer__veld">
            Thuisarts.nl-link
            <input type="url" id="beheer-thuisarts" placeholder="https://www.thuisarts.nl/...">
          </label>
          <label class="beheer__veld">
            Tekst voor thuis
            <textarea id="beheer-notitie" rows="3" placeholder="Wat wil je dat de patiënt thuis nog eens kan teruglezen?"></textarea>
          </label>
          <label class="beheer__veld">
            Wachtwoord
            <input type="password" id="beheer-wachtwoord" autocomplete="current-password">
            <span class="beheer__hint">Voorkomt dat een willekeurige bezoeker dit kan aanpassen. Dit is het wachtwoord dat jij zelf instelt bij het live zetten (zie README) — niet nodig om de tekst te kúnnen lezen, alleen om 'm te wijzigen.</span>
          </label>
          <div class="beheer__knoppen">
            <button type="submit" class="knop knop--primair">Opslaan</button>
          </div>
          <p id="beheer-status" class="beheer__status" hidden></p>
        </form>
      </aside>
    </div>

    <!-- Printgebied: onzichtbaar op scherm, toont bij het printen altijd de
         VOLTOOIDE tekening + QR-code, los van de huidige stap op scherm.
         Wordt gevuld door tekening.js zodra het thema geladen is. -->
    <div id="printgebied" class="printgebied">
      <h1 id="print-titel" class="printgebied__titel"></h1>
      <svg id="print-svg" class="printgebied__tekening" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="printgebied__onderkant">
        <div id="print-qr" class="printgebied__qr"></div>
        <div class="printgebied__links">
          <p>Scan de QR-code om deze uitleg thuis nog eens te bekijken, of typ:</p>
          <p id="print-url"></p>
          <p id="print-thuisarts"></p>
          <p id="print-notitie"></p>
        </div>
      </div>
    </div>

  </main>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/registry.js"></script>
  <script src="js/categorieen/manifest.js"></script>
  <script src="js/themas/manifest.js"></script>
  <script src="js/tekening.js"></script>
</body>
</html>
